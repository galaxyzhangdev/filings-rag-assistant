# Same as: docker run -p 127.0.0.1:8000:8000 --env-file .env -v "$(pwd)/data:/app/data" filings-rag
# Published on localhost only: /ask has no auth and spends the OpenAI key, so don't expose it to the network.
services:
  api:
    build: .
    image: filings-rag
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
