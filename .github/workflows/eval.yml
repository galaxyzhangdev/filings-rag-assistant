# Paid RAG-triad regression gate. Separate workflow so the paths filter applies only here (paths: is per-workflow).
# Runs on manual dispatch, or on push to main when pipeline code changes. Never on pull_request (needs the secret).
name: Eval gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [filings.py, ingest.py, embed.py, retrieve.py, generate.py, eval.py, uv.lock, .github/workflows/eval.yml]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
          enable-cache: true
      - run: uv sync --frozen --no-dev

      # Chroma index keyed on everything that shapes it: which filings (filings.py), chunking (ingest.py),
      # embedding/storage (embed.py), and library versions incl. chromadb's on-disk format (uv.lock).
      # Bump v1 to force a rebuild, e.g. to pick up a newly filed 10-K. Any rebuild (key change or cache
      # eviction too) fetches the latest 10-Ks, so a new filing changes what CI scores vs. the README baselines.
      - name: Restore Chroma index
        id: chroma
        uses: actions/cache/restore@v6
        with:
          path: data/chroma
          key: chroma-v1-${{ hashFiles('filings.py', 'ingest.py', 'embed.py', 'uv.lock') }}

      # On a miss: fetch GOOGL + MU 10-Ks from SEC, chunk, and embed (~$0.01). embed.py calls ingest per ticker.
      - name: Build Chroma index (ingest + embed)
        if: steps.chroma.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python embed.py

      # Save right after building, so a red gate below doesn't discard the index (actions/cache saves only on success).
      - name: Save Chroma index
        if: steps.chroma.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/chroma
          key: ${{ steps.chroma.outputs.cache-primary-key }}

      # Core set, vector method, fresh answers (no answer cache), so code changes are actually re-scored.
      # Exits 1 if any triad average is below GATE_THRESHOLDS in eval.py.
      - name: Eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python eval.py --no-cache
